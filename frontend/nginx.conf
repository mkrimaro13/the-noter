server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # Runtime sync settings are written by the container entrypoint. They contain
  # credentials, so never cache them and never fall back to the SPA shell.
  location = /sync-config.json {
    default_type application/json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Proxy CouchDB through the app origin so only the frontend needs to be exposed.
  location /couchdb/ {
    rewrite ^/couchdb/(.*)$ /$1 break;
    proxy_pass http://backend:5984;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    client_max_body_size 100m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }

  # The SPA entry point must never be cached, or a deploy would keep serving old
  # asset names after the hashed files change.
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
  }

  # Hashed build output and fonts can be cached for a long time.
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpe?g|webp|avif)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
