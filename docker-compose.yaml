name: the-noter

services:
  backend:
    build:
      context: ./backend
    image: the-noter-backend:local
    # The image is built here, not published to a registry. This stops Compose
    # from trying to pull it first and printing a misleading "pull access denied".
    pull_policy: build
    container_name: the-noter-backend
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-thenoter-local}
    ports:
      # Localhost only until private networking is added.
      - "127.0.0.1:5984:5984"
    volumes:
      - ./backend/data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: creates the notes database, the least-privilege app user, and the
  # database security rules. Safe to run on every start.
  init:
    image: the-noter-backend:local
    container_name: the-noter-init
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/init-couchdb.sh"]
    environment:
      COUCHDB_URL: http://backend:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-thenoter-local}
      COUCHDB_DB: ${COUCHDB_DB:-thenoter}
      COUCHDB_APP_USER: ${COUCHDB_APP_USER:-thenoter}
      COUCHDB_APP_PASSWORD: ${COUCHDB_APP_PASSWORD:-thenoter-app-local}
    depends_on:
      backend:
        condition: service_healthy

  # Scheduled CouchDB maintenance: purges old note tombstones and requests
  # compaction every MAINTENANCE_INTERVAL_SECONDS. Needs the admin
  # credentials because the app user cannot call _purge or _compact. The
  # script is bind-mounted read-only and records its progress in the
  # meta:maintenance document, which the frontend shows as diagnostics.
  maintenance:
    image: node:22-alpine
    container_name: the-noter-maintenance
    restart: unless-stopped
    command: ["node", "/app/maintenance.mjs"]
    volumes:
      - ./backend/scripts/maintenance.mjs:/app/maintenance.mjs:ro
    environment:
      COUCHDB_URL: http://backend:5984
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-thenoter-local}
      COUCHDB_DB: ${COUCHDB_DB:-thenoter}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-21600}
      MAINTENANCE_RETENTION_DAYS: ${MAINTENANCE_RETENTION_DAYS:-30}
    depends_on:
      backend:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    image: the-noter-frontend:local
    # Same as the backend: build locally instead of attempting a registry pull.
    pull_policy: build
    container_name: the-noter-frontend
    restart: unless-stopped
    environment:
      # Rendered into /sync-config.json at container start. Only the app user
      # credentials are exposed, never the admin ones.
      # Use /couchdb/thenoter to proxy CouchDB through the app origin when exposing
      # only the frontend (e.g. via Tailscale Serve).
      SYNC_URL: ${SYNC_URL:-/couchdb/thenoter}
      SYNC_USER: ${COUCHDB_APP_USER:-thenoter}
      SYNC_PASSWORD: ${COUCHDB_APP_PASSWORD:-thenoter-app-local}
    depends_on:
      backend:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      # Localhost only until private networking is added.
      - "127.0.0.1:8080:80"
