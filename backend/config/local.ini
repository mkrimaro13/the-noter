; The Noter — CouchDB settings.
; Copied to /opt/couchdb/etc/local.d/10-thenoter.ini by the backend Dockerfile.

[couchdb]
; One personal server. Creates the system databases automatically and keeps
; CouchDB from waiting for a cluster that will never exist.
single_node = true

; A note can grow large once images are attachments. 50 MB is a ceiling, not a
; target; attachments are stored separately from the JSON body.
max_document_size = 50000000

[cluster]
; Single node means one shard and one copy. Without this, CouchDB asks for the
; default three copies and refuses to create the system databases.
q = 1
n = 1

[chttpd]
; Docker publishes the container port; CouchDB must listen beyond loopback.
bind_address = 0.0.0.0
port = 5984

; Leave this off so the unauthenticated /_up healthcheck works. Database
; operations still require credentials, and the port is localhost-only.
require_valid_user = false

[httpd]
; When the app proxies CouchDB through the same origin (Tailscale app-only),
; CORS is not needed. Leave disabled to avoid unnecessary exposure.
enable_cors = false

[log]
level = info
